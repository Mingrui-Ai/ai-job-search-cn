# CN fork (H31): the real-render tests of tests/test_cn_resume_pdf.py on Linux.
#
# Those tests need Typst and a Chinese font, which ci.yml installs neither of,
# so there they skip. This job downloads a pinned Typst release and two pinned
# OFL-1.1 fonts, checks the SHA-256 of each before anything uses it (a mismatch
# fails the job), and runs the tests with JOBSEARCH_CN_REQUIRE_TYPST=1, under
# which a missing piece fails them instead of skipping them. Fonts are
# downloaded on every run and never committed. Typst sees only those two and
# its own built-in fonts, whatever the runner image ships, so a runner update
# cannot change the layout the tests measure.
#
# A file of its own so that ci.yml stays as upstream ships it. To guard master,
# the job's name must be among the required checks of branch protection.
# Updating a pin: docs/cn/resume-pdf.md, "CI 上的真实渲染".

name: CN resume PDF

on:
  push:
    # TEMP (H31): feat/cn-h31-ci-typst runs the job before its PR exists; removed before the PR.
    branches: [master, feat/cn-h31-ci-typst]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-render:
    name: Resume PDF real render (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TYPST_VERSION: "0.15.1"
      TYPST_SHA256: b6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
      # notofonts/noto-cjk at tag Serif2.003; Sans/LICENSE and Serif/LICENSE are the SIL OFL 1.1.
      NOTO_CJK_COMMIT: 9b0f1436e455d902de067a2501422e5dc71ad16b
      NOTO_SANS_SC_SHA256: e68bafcb48a2707749396aa12bbbd833cb70401f3a9a689fd2902c7e0d295964
      NOTO_SERIF_SC_SHA256: 5326cfb097e3ab26fcb39329752b5c0a439bf8d5c4649520e4b492939c352a09
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pypdf (one test compares the PDF's font maps with its reading)
        run: python -m pip install pypdf==6.21.3
      - name: Download Typst and the fonts, and check their SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/downloads" && cd "$RUNNER_TEMP/downloads"
          fetch() { curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$1" "$2"; }
          fetch typst.tar.xz "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          noto="https://raw.githubusercontent.com/notofonts/noto-cjk/$NOTO_CJK_COMMIT"
          fetch NotoSansSC-VF.ttf "$noto/Sans/Variable/TTF/Subset/NotoSansSC-VF.ttf"
          fetch NotoSerifSC-VF.ttf "$noto/Serif/Variable/TTF/Subset/NotoSerifSC-VF.ttf"
          # Every file is checked before it is unpacked or used; a wrong or empty digest fails here.
          printf '%s  %s\n' \
            "$TYPST_SHA256" typst.tar.xz \
            "$NOTO_SANS_SC_SHA256" NotoSansSC-VF.ttf \
            "$NOTO_SERIF_SC_SHA256" NotoSerifSC-VF.ttf \
            | sha256sum --check --strict
          tar -xJf typst.tar.xz
          mkdir fonts && mv NotoSansSC-VF.ttf NotoSerifSC-VF.ttf fonts/
          {
            echo "JOBSEARCH_CN_TYPST=$RUNNER_TEMP/downloads/typst-x86_64-unknown-linux-musl/typst"
            echo "TYPST_FONT_PATHS=$RUNNER_TEMP/downloads/fonts"
            echo "TYPST_IGNORE_SYSTEM_FONTS=true"
          } >> "$GITHUB_ENV"
      - name: Show Typst and the fonts it sees
        run: |
          "$JOBSEARCH_CN_TYPST" --version
          "$JOBSEARCH_CN_TYPST" fonts
      - name: Real-render tests (a missing piece fails them here rather than skipping them)
        env:
          JOBSEARCH_CN_REQUIRE_TYPST: "1"
        run: python -m unittest tests.test_cn_resume_pdf -v
